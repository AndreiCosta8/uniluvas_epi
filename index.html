function getBase(){

  if(saved) return saved.replace(/\/$/,'');
  const h=window.location.href.split('?')[0];
  return h.startsWith('file://')?'':h;
}
function makeUrl(params){
  const base=getBase();

}
function isFileProtocol(){return window.location.href.startsWith('file://');}

function waUrl(text){return 'https://wa.me/?text='+encodeURIComponent(text);}
function waLink(url,msg){

  return `<a class="btn btn-wa btn-sm" href="${waUrl(txt)}" target="_blank" rel="noopener">📲 WhatsApp</a>`;
}

function copyText(text,btn){
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  if(btn){const o=btn.innerHTML;btn.innerHTML='✓ Copiado!';setTimeout(()=>{btn.innerHTML=o},1800);}
}

// ── URL ROUTING ────────────────────────────────────────
function handleUrl(){
  const p=new URLSearchParams(window.location.search);
  const view=p.get('view'), code=(p.get('code')||'').toUpperCase(), tab=p.get('tab');
  // ── Deep-link via ?tab= (vindo do workspace) ───────────────
  // Mapeia direto pra aba do admin. Aceita: fichas, relatorios, codigos, portais, config
  if(tab && ['fichas','relatorios','codigos','portais','config'].includes(tab)){
    history.replaceState({},'',window.location.pathname);
    S.adminTab = tab;
    S.view = S.auth ? 'admin' : 'adminAuth';
    return;
  }
  if(!view) return;
  // Limpa a URL imediatamente — evita que o refresh reabra a mesma tela
  history.replaceState({},'',window.location.pathname);
  if(view==='form'){
    if(code){
      const e=S.codes.find(c=>c.code===code);
      if(e){S.formCode=code;S.form.d.epi=e.epi;S.form.d.referencia=e.referencia;S.form.d.ca=e.ca;S.form.d.amostras=e.amostras||'';S.form.d.dataEntrega=e.dataEntrega||'';S.form.d.caracteristicas=e.caracteristicas||'';S.form.d.fornecedor=e.fornecedor||'';S.form.codeLock=true;S.form.step=2;}
    }
    S.view='form';
  }else if(view==='formblank'){S.view='form';}
  else if(view==='portal'){
    if(code){const pt=S.portals.find(p=>p.code===code);if(pt){S.portalCompany=pt;S.view='portal';return;}}
    S.view='portalEntry';
  }else if(view==='sesmt'){
    if(code){
      // Lê do localStorage local (pode ser diferente do Firebase se outra pessoa gravou)
      const fresh=ld('tests',S.tests);
      const t=fresh.find(t=>(t.sesmtCode||'').toUpperCase()===code);
      if(t){
        if(t.decisaoSESMT){S.sesmtCodeErr='Este parecer já foi registrado.';S.view='sesmtEntry';return;}
        S.tests=fresh;S.sesmtRevTest=t;S.sesmtD2='';S.view='sesmtReview';return;
      }
    }
    S.view='sesmtEntry';
  }else if(view==='admin'){S.view=S.auth?'admin':'adminAuth';}
}

function handleFotoUpload(input){
  const file=input.files[0];if(!file)return;
  if(file.size>900000){alert('Imagem muito grande. Use uma foto menor que 900KB.');input.value='';return;}
  const img=new Image();
  const reader=new FileReader();
  reader.onload=e=>{
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=600;let w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max;}
      if(h>max){w=Math.round(w*max/h);h=max;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      S.newCode.foto=canvas.toDataURL('image/jpeg',0.75);
      R();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function donutChart(){
  const ap=S.tests.filter(t=>t.decisaoSESMT==='aprovado').length;
  const rj=S.tests.filter(t=>t.decisaoSESMT==='rejeitado').length;
  const pd=S.tests.filter(t=>!t.decisaoSESMT).length;
  const total=ap+rj+pd,pct=total?Math.round(ap/total*100):0;
  const data=[{v:ap,c:'#0E8F64'},{v:rj,c:'#C43030'},{v:pd,c:'#C8CDD5'}].filter(d=>d.v>0);
  const cx=80,cy=80,R=56,ir=34;let paths='';
  if(!total)paths=`<circle cx="${cx}" cy="${cy}" r="${(R+ir)/2}" fill="none" stroke="#E1E5EA" stroke-width="${R-ir}"/>`;
  else if(data.length===1)paths=`<circle cx="${cx}" cy="${cy}" r="${(R+ir)/2}" fill="none" stroke="${data[0].c}" stroke-width="${R-ir}"/>`;
  else{let ang=-Math.PI/2;data.forEach(d=>{const sw=(d.v/total)*2*Math.PI,x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);ang+=sw;const x2=cx+R*Math.cos(ang),y2=cy+R*Math.sin(ang),ix1=cx+ir*Math.cos(ang),iy1=cy+ir*Math.sin(ang),ix2=cx+ir*Math.cos(ang-sw),iy2=cy+ir*Math.sin(ang-sw),la=sw>Math.PI?1:0;paths+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${la} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${ix1.toFixed(1)} ${iy1.toFixed(1)} A${ir} ${ir} 0 ${la} 0 ${ix2.toFixed(1)} ${iy2.toFixed(1)}Z" fill="${d.c}"/>`});}
  return `<div class="fc g16"><svg width="160" height="160" viewBox="0 0 160 160">${paths}<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="22" font-weight="600" fill="#111827" font-family="DM Sans">${pct}%</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#9AA2AE" font-family="DM Sans">aprovação</text></svg><div style="display:flex;flex-direction:column;gap:10px;font-size:13px"><div class="fc g8"><div style="width:10px;height:10px;border-radius:50%;background:#0E8F64;flex-shrink:0"></div>${ap} aprovado${ap!==1?'s':''}</div><div class="fc g8"><div style="width:10px;height:10px;border-radius:50%;background:#C43030;flex-shrink:0"></div>${rj} rejeitado${rj!==1?'s':''}</div><div class="fc g8"><div style="width:10px;height:10px;border-radius:50%;background:#C8CDD5;flex-shrink:0"></div>${pd} pendente${pd!==1?'s':''}</div></div></div>`;
}
function critChart(){
  if(!S.tests.length)return`<div class="empty">Sem dados</div>`;
  const W=200;
  const stats=CRIT.map(c=>{const ts=S.tests.filter(t=>t.avaliacao?.[c.key]);const n=ts.length;if(!n)return{l:c.label,pA:0,pAR:0,pR:0,pctA:0};const a=ts.filter(t=>t.avaliacao[c.key]==='A').length,ar=ts.filter(t=>t.avaliacao[c.key]==='AR').length,r=ts.filter(t=>t.avaliacao[c.key]==='R').length;return{l:c.label,pA:a/n,pAR:ar/n,pR:r/n,pctA:Math.round(a/n*100)};}).sort((a,b)=>b.pctA-a.pctA);
  const rows=stats.map((s,i)=>{const y=i*32;let x=0;const bA=s.pA>0?`<rect x="${x}" y="4" width="${(s.pA*W).toFixed(1)}" height="14" rx="2" fill="#0E8F64"/>`:'';x+=s.pA*W;const bAR=s.pAR>0?`<rect x="${x.toFixed(1)}" y="4" width="${(s.pAR*W).toFixed(1)}" height="14" rx="2" fill="#E89B00"/>`:'';x+=s.pAR*W;const bR=s.pR>0?`<rect x="${x.toFixed(1)}" y="4" width="${(s.pR*W).toFixed(1)}" height="14" rx="2" fill="#C43030"/>`:'';return`<g transform="translate(0,${y})"><text x="0" y="15" font-size="10.5" fill="#6B7685" font-family="DM Sans">${s.l}</text><g transform="translate(106,0)">${bA}${bAR}${bR}<rect x="0" y="4" width="${W}" height="14" rx="2" fill="none" stroke="#E1E5EA" stroke-width=".8"/></g><text x="${106+W+6}" y="15" font-size="11" font-weight="600" fill="#111827" font-family="DM Sans">${s.pctA}%</text></g>`;}).join('');
  return`<svg width="100%" viewBox="0 0 340 ${CRIT.length*32}" style="overflow:visible">${rows}</svg>`;
}
function monthChart(){
  if(!S.tests.length)return`<div class="empty">Sem dados</div>`;
  const months={};const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.toISOString().substr(0,7);months[k]={label:d.toLocaleDateString('pt-BR',{month:'short'}),ap:0,rj:0,pd:0,total:0};}
  S.tests.forEach(t=>{const m=t.createdAt.substr(0,7);if(months[m]){months[m].total++;const d=t.decisaoSESMT;if(d==='aprovado')months[m].ap++;else if(d==='rejeitado')months[m].rj++;else months[m].pd++;}});
  const data=Object.values(months),maxV=Math.max(...data.map(d=>d.total),1);
  const H=80,bW=26,gap=16;
  const bars=data.map((m,i)=>{const x=i*(bW+gap);const hAp=(m.ap/maxV)*H,hRj=(m.rj/maxV)*H,hPd=(m.pd/maxV)*H;let yB=H;const rPd=hPd>0?`<rect x="${x}" y="${(yB-=hPd).toFixed(1)}" width="${bW}" height="${hPd.toFixed(1)}" rx="2" fill="#C8CDD5"/>`:'';const rRj=hRj>0?`<rect x="${x}" y="${(yB-=hRj).toFixed(1)}" width="${bW}" height="${hRj.toFixed(1)}" rx="2" fill="#C43030"/>`:'';const rAp=hAp>0?`<rect x="${x}" y="${(yB-=hAp).toFixed(1)}" width="${bW}" height="${hAp.toFixed(1)}" rx="2" fill="#0E8F64"/>`:'';const lbl=m.total>0?`<text x="${x+bW/2}" y="${(H-(hAp+hRj+hPd)-4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#374151" font-family="DM Sans">${m.total}</text>`:'';return`${rPd}${rRj}${rAp}${lbl}<text x="${x+bW/2}" y="${H+14}" text-anchor="middle" font-size="10.5" fill="#9AA2AE" font-family="DM Sans">${m.label}</text>`;}).join('');
  const tw=(bW+gap)*6-gap;
  return`<svg width="100%" viewBox="0 0 ${tw} ${H+20}" style="overflow:visible"><line x1="0" y1="${H}" x2="${tw}" y2="${H}" stroke="#E1E5EA" stroke-width="1"/>${bars}</svg>`;
}

function vAFichas(){
  const fl=S.tests.filter(t=>{
    if(S.fSt!=='todos'){const d=t.decisaoSESMT;if(S.fSt==='aprovado'&&d!=='aprovado')return false;if(S.fSt==='rejeitado'&&d!=='rejeitado')return false;if(S.fSt==='pendente'&&(!t.decisaoUsuario||t.decisaoSESMT))return false;}
    if(S.fEmp&&!t.empresa.toLowerCase().includes(S.fEmp.toLowerCase()))return false;
    if(S.fDateFrom&&t.createdAt<S.fDateFrom)return false;
    if(S.fDateTo&&t.createdAt>S.fDateTo)return false;
    return true;
  });
  const n=S.tests.length,ap=S.tests.filter(t=>t.decisaoSESMT==='aprovado').length;
  const rj=S.tests.filter(t=>t.decisaoSESMT==='rejeitado').length;
  const pd=S.tests.filter(t=>!t.decisaoSESMT&&t.decisaoUsuario).length;
  return`
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;border-bottom:1.5px solid var(--g200)">
    <div class="stat"><div class="sl">Total</div><div class="sv">${n}</div></div>
    <div class="stat" style="border-color:#A7E5CB"><div class="sl" style="color:var(--green)">Aprovados</div><div class="sv" style="color:var(--green-d)">${ap}</div><div class="ss">${n?Math.round(ap/n*100):0}%</div></div>
    <div class="stat" style="border-color:#F0D080"><div class="sl" style="color:var(--amber)">Pend. SESMT</div><div class="sv" style="color:var(--amber-d)">${pd}</div></div>
    <div class="stat" style="border-color:#F9B0B0"><div class="sl" style="color:var(--red)">Rejeitados</div><div class="sv" style="color:var(--red-d)">${rj}</div></div>
  </div>
  <div class="fc g8" style="padding:10px 20px;border-bottom:1.5px solid var(--g200)">
    <select style="width:auto;min-width:130px" onchange="S.fSt=this.value;R()">
      <option value="todos" ${S.fSt==='todos'?'selected':''}>Todos</option>
      <option value="aprovado" ${S.fSt==='aprovado'?'selected':''}>Aprovados</option>
      <option value="rejeitado" ${S.fSt==='rejeitado'?'selected':''}>Rejeitados</option>
      <option value="pendente" ${S.fSt==='pendente'?'selected':''}>Pendentes SESMT</option>
    </select>
    <input placeholder="Buscar empresa..." style="flex:1;max-width:160px" oninput="S.fEmp=this.value;R()" value="${S.fEmp}">
    <input type="date" title="De" style="width:auto" oninput="S.fDateFrom=this.value;R()" value="${S.fDateFrom}">
    <input type="date" title="Áté" style="width:auto" oninput="S.fDateTo=this.value;R()" value="${S.fDateTo}">
    ${(S.fDateFrom||S.fDateTo)?'<button class="btn btn-ghost btn-sm" onclick="S.fDateFrom=\'\';S.fDateTo=\'\';R()">×</button>':''}
    <div class="ts tm" style="margin-left:auto">${fl.length} ficha${fl.length!==1?'s':''}</div>
  </div>
  <div style="background:var(--w)">
    <div class="thdr tcols7"><div>EPI / Referência</div><div>Empresa</div><div class="hm">Data</div><div>Avaliação</div><div>Status</div><div class="hm">Ações</div></div>
    ${fl.length===0?`<div class="empty">📋 Nenhuma ficha encontrada</div>`:''}
    ${fl.map(t=>`<div class="trow tcols7"><div style="cursor:pointer" onclick="viewTest('${t.id}')"><div class="fw5">${t.epi}</div><div class="tx tm mt4">${t.referencia||'—'} · CA ${t.ca||'—'}</div></div><div style="cursor:pointer" onclick="viewTest('${t.id}')"><div>${t.empresa}</div><div class="tx tm">${t.contato||''}</div></div><div class="ts tm hm" style="cursor:pointer" onclick="viewTest('${t.id}')">${fmtD(t.createdAt)}</div><div style="cursor:pointer" onclick="viewTest('${t.id}')">${abadge(t.avaliacao)}</div><div style="cursor:pointer" onclick="viewTest('${t.id}')">${sbadge(t)}</div><div class="hm" style="display:flex;gap:6px;align-items:center"><button class="btn btn-sm" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();S.sel=S.tests.find(x=>x.id==='${t.id}');nav('editForm')">✎</button><button class="btn btn-sm" style="padding:3px 8px;font-size:11px;color:var(--red)" onclick="event.stopPropagation();deleteTest('${t.id}')">🗑</button></div></div>`).join('')}
  </div>`;
}

function vHistorico(){
  const byEpi={};
  S.tests.forEach(t=>{if(!byEpi[t.epi])byEpi[t.epi]={n:0,ap:0,rj:0,pd:0};
    byEpi[t.epi].n++;if(t.decisaoSESMT==='aprovado')byEpi[t.epi].ap++;
    else if(t.decisaoSESMT==='rejeitado')byEpi[t.epi].rj++;else byEpi[t.epi].pd++;});
  const sorted=Object.entries(byEpi).sort((a,b)=>b[1].n-a[1].n);
  if(!sorted.length)return'<div class="empty" style="padding:40px">📋 Nenhum dado ainda.</div>';
  return'<div style="padding:20px;max-width:860px">'+sorted.map(([epi,s])=>{
    const pct=Math.round(s.ap/s.n*100);
    return'<div class="card mb-12"><div class="fb mb8"><div><div class="fw6" style="font-size:14px">'+epi+'</div>'
    +'<div class="tx tm mt4">'+s.n+' avaliação'+(s.n!==1?'ões':'')+' · '+pct+'% aprovação</div></div>'
    +'<div class="fc g8">'+(s.ap>0?'<span class="badge bg">'+s.ap+' aprov.</span>':'')+(s.pd>0?'<span class="badge ba">'+s.pd+' pend.</span>':'')+(s.rj>0?'<span class="badge br">'+s.rj+' rejeit.</span>':'')+'</div></div>'
    +'<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px">'+(s.ap>0?'<div style="flex:'+s.ap+';background:var(--green)"></div>':'')+(s.pd>0?'<div style="flex:'+s.pd+';background:#F0C040"></div>':'')+(s.rj>0?'<div style="flex:'+s.rj+';background:var(--red)"></div>':'')+'</div></div>';
  }).join('')+'</div>';
}

  const n=S.tests.length,ap=S.tests.filter(t=>t.decisaoSESMT==='aprovado').length;

  const avgC=allR.length?Math.round(allR.filter(v=>v==='A').length/allR.length*100):0;
  const pct=n?Math.round(ap/n*100):0;
  return`

    <div class="stat"><div class="sl">Taxa aprovação</div><div class="sv">${pct}%</div></div>

  </div>
  <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px;border-bottom:1.5px solid var(--g200)">
    <div><div class="sectitle mb12">Status geral</div>${donutChart()}</div>

function sendAllWa(){

// ── PORTAL ─────────────────────────────────────────────
function portalChart(tests){
  if(!tests.length)return '';
  const ap=tests.filter(t=>t.decisaoSESMT==='aprovado').length,rj=tests.filter(t=>t.decisaoSESMT==='rejeitado').length,pd=tests.filter(t=>!t.decisaoSESMT&&t.decisaoUsuario).length;
  const pct=Math.round(ap/tests.length*100);
  return '<div class="card mb-16" style="background:linear-gradient(135deg,#0D1F35,#163352);border:none;color:#fff">'
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between">'
    +'<div><div style="font-size:10px;opacity:.5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Resultado geral</div>'
    +'<div style="font-size:36px;font-weight:600">'+pct+'%</div>'
    +'<div style="font-size:12px;opacity:.5">taxa de aprovação</div></div>'
    +'<div style="font-size:12px;display:flex;flex-direction:column;gap:6px;margin-top:4px">'
    +'<div style="opacity:.85">● '+ap+' aprovado'+(ap!==1?'s':'')+'</div>'
    +'<div style="opacity:.85">● '+rj+' rejeitado'+(rj!==1?'s':'')+'</div>'
    +'<div style="opacity:.85">● '+pd+' pendente'+(pd!==1?'s':'')+'</div>'
    +'</div></div></div>';
}

  const cancelAct=step===1?(isEdit?"nav('detail')":(codeLock?"nav('formEntry')":`nav('home')`)):`fBack()`;
  return vHeader()+`
  <div class="sbar">${sh}</div>

  </div></div>
  <div style="background:var(--blue-l);border:1.5px solid #BDD9F5;border-radius:var(--r12);padding:16px;margin-top:4px">
    <div style="font-size:13px;font-weight:600;color:#1E4A7A;margin-bottom:12px">✍ Assinatura digital</div>
    <div class="g2">
      <div class="fg" style="margin:0"><label class="lbl req">Nome completo</label><input id="f_assinaturaNome" placeholder="Seu nome completo" value="${d.assinaturaNome}" oninput="S.form.d.assinaturaNome=this.value"></div>
      <div class="fg" style="margin:0"><label class="lbl req">CPF</label><input id="f_assinaturaCpf" placeholder="000.000.000-00" maxlength="14" value="${d.assinaturaCpf}" oninput="this.value=cpfMask(this.value);S.form.d.assinaturaCpf=this.value"></div>
    </div>
    <div class="ts tm mt8">Ao enviar, você confirma que as informações são verdadeiras e que esta é sua assinatura eletrônica.</div>
  </div>
  <div class="card" style="background:var(--g50);margin-top:14px;border-color:var(--g200)"><div class="ts fw5 mb8">Resumo</div><div class="ts tm" style="line-height:2"><strong style="color:var(--g700)">EPI:</strong> ${d.epi||'—'} &nbsp;·&nbsp; <strong style="color:var(--g700)">Empresa:</strong> ${d.empresa||'—'} &nbsp;·&nbsp; <strong style="color:var(--g700)">Critérios:</strong> ${CRIT.filter(c=>d[c.key]).length}/${CRIT.length}</div></div>`;}

// ── SUCCESS ────────────────────────────────────────────
function vSuccess(){return vHeader()+`
  <div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 96px);padding:20px">
    <div style="text-align:center;max-width:420px">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:var(--green);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)">✓</div>
      <div style="font-size:24px;font-weight:600;margin-bottom:8px">Ficha enviada com sucesso!</div>
      <div class="ts tm mb24" style="line-height:1.6">Obrigado pelo preenchimento. A equipe Uniluvas irá analisar e registrar o parecer técnico.</div>
      <div class="fc g8" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" onclick="nav('form')">Avaliar outro EPI</button><button class="btn" onclick="nav('home')">Voltar ao início</button></div>
    </div>
  </div>
  ${vFooter()}`;}
function vSesmtDone(){return vHeader()+`
  <div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 96px);padding:20px">
    <div style="text-align:center;max-width:420px">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:var(--green);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)">✓</div>
      <div style="font-size:24px;font-weight:600;margin-bottom:8px">Parecer SESMT registrado!</div>
      <div class="ts tm mb24" style="line-height:1.6">O parecer técnico foi salvo. A Uniluvas foi notificada e o status da ficha foi atualizado.</div>
      <button class="btn btn-primary" onclick="nav('home')">Voltar ao início</button>
    </div>
  </div>
  ${vFooter()}`;}

// ── RENDER ─────────────────────────────────────────────
function R(){
  document.getElementById('app').innerHTML=({
    home:vHome,adminAuth:vAuth,admin:vAdmin,detail:vDetail,
    editForm:vForm,sesmt:vSesmt,sesmtReview:vSesmtReview,sesmtDone:vSesmtDone,
    form:vForm,success:vSuccess,portal:vPortal,portalDetail:vPortalDetail,
    formEntry:()=>vCodeEntry({role:'FUNCIONÁRIO',title:'Código de Acesso',desc:'Insira o código enviado pela Uniluvas para ter o EPI pré-preenchido',ibg:'background:var(--amber-l)',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" fill="#FEF3DC" stroke="#C07A00" stroke-width="1.5"/><path d="M9 11V7a3 3 0 016 0v4" stroke="#C07A00" stroke-width="1.5" fill="none"/></svg>',sk:'formCode',ek:'formCodeErr',fn:'applyFormCode'}),
    portalEntry:()=>vCodeEntry({role:'CLIENTE',title:'Portal da Empresa',desc:'Insira o código da empresa para acessar os resultados dos testes de EPI',ibg:'background:var(--blue-l)',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" fill="#DBEAFE"/><rect x="3" y="5" width="18" height="14" rx="2" stroke="#1A6EBB" stroke-width="1.5"/><path d="M7 10h10M7 14h6" stroke="#1A6EBB" stroke-width="1.5" stroke-linecap="round"/></svg>',sk:'portalCode',ek:'portalCodeErr',fn:'lookupPortal'}),
    sesmtEntry:()=>vCodeEntry({role:'SESMT / SEGURANÇA',title:'Revisão de Parecer',desc:'Insira o código de revisão para registrar o parecer técnico do EPI',ibg:'background:var(--amber-l)',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3L14.5 9H20l-4.6 3.3 1.7 5.5L12 14.5 6.9 17.8l1.7-5.5L4 9h5.5z" fill="#FEF3DC" stroke="#C07A00" stroke-width="1.3"/></svg>',sk:'sesmtCode',ek:'sesmtCodeErr',fn:'lookupSesmtCode'}),
  }[S.view]||vHome)()+vToast();
  setTimeout(()=>{const el=document.getElementById('ci');if(el)el.focus();},80);
}

// ── BOOTSTRAP ──────────────────────────────────────────
(async()=>{
  try{await initData();}catch(e){S.tests=ld('tests',null)||DTESTS;S.codes=ld('codes',null)||DCODES;S.portals=ld('portals',null)||DPORTALS;}
  handleUrl();
  R();
})();
window.addEventListener('popstate',()=>{handleUrl();R();});
</script>
</body>
</html>
